name: Manual Build

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build (comma-separated)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - macos
          - linux
          - windows
      profile:
        description: "Rust build profile"
        required: false
        default: "release"
        type: choice
        options:
          - release
          - dev
      target:
        description: "Specific Rust target triple (leave empty for default host target)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: perry-macos-aarch64
            platform: macos
          - os: macos-15
            target: x86_64-apple-darwin
            artifact: perry-macos-x86_64
            platform: macos
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: perry-linux-x86_64
            platform: linux
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: perry-linux-aarch64
            platform: linux
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            artifact: perry-linux-x86_64-musl
            platform: linux
            musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: perry-linux-aarch64-musl
            platform: linux
            musl: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: perry-windows-x86_64
            platform: windows

    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"

    steps:
      - name: Filter platforms
        id: filter
        shell: bash
        run: |
          PLATFORMS="${{ github.event.inputs.platforms }}"
          if [ "$PLATFORMS" = "all" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif echo "$PLATFORMS" | grep -q "${{ matrix.platform }}"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.filter.outputs.run == 'true'

      - name: Install Rust toolchain
        if: steps.filter.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 'nightly-2026-08-20'
          targets: ${{ matrix.target }}

      - uses: ./.github/actions/setup-llvm22
        if: steps.filter.outputs.run == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.filter.outputs.run == 'true'
        with:
          shared-key: "manual-${{ matrix.target }}"

      - name: Install dependencies (macOS)
        if: steps.filter.outputs.run == 'true' && runner.os == 'macOS'
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Install dependencies (Linux glibc)
        if: steps.filter.outputs.run == 'true' && runner.os == 'Linux' && !endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libwebkitgtk-6.0-dev libshumate-dev

      - name: Install dependencies (Linux musl)
        if: steps.filter.outputs.run == 'true' && endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Determine target
        if: steps.filter.outputs.run == 'true'
        id: target
        run: |
          OVERRIDE="${{ github.event.inputs.target }}"
          if [ -n "$OVERRIDE" ]; then
            echo "triple=$OVERRIDE" >> "$GITHUB_OUTPUT"
          else
            echo "triple=${{ matrix.target }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build perry
        if: steps.filter.outputs.run == 'true'
        run: |
          FEATURES=""
          if [ "${{ matrix.musl }}" = "true" ]; then
            # Musl legs cannot statically link the glibc-built in-process LLVM
            # (#7353): its objects carry versioned glibc refs (__isoc23_*@@GLIBC_2.38)
            # and -lz3/-lxml2/-lffi system libs — neither links into musl, and a
            # forced link produces a musl+glibc mixed process that segfaults at
            # startup. Build the pure-static variant (no llvm-inprocess feature):
            # perry then shells out to the LLVM tools (opt/llc) at compile time,
            # like pre-#7353 builds. See .cargo/config.toml for the matching
            # per-target rustflags (musl libc.a search order + fortify off).
            FEATURES="--no-default-features --features full-cli"
          fi
          cargo build --${{ github.event.inputs.profile }} --target ${{ steps.target.outputs.triple }} $FEATURES -p perry

      - name: Verify musl binary is fully static
        if: steps.filter.outputs.run == 'true' && matrix.musl == true
        run: |
          BIN="target/${{ steps.target.outputs.triple }}/${{ github.event.inputs.profile }}/perry"
          file "$BIN" | grep -q static || { echo "::error::$BIN is not statically linked"; exit 1; }
          if readelf -l "$BIN" | grep -q INTERP; then
            echo "::error::$BIN has a dynamic interpreter — musl artifact regressed to glibc-hybrid"
            exit 1
          fi

      - name: Build runtime, stdlib, and shared-tokio ext libraries
        # #507 — tokio-using wrappers (ws / net / http / db drivers / mail)
        # MUST be built in the SAME cargo invocation as perry-stdlib. Each
        # separate `cargo build` invocation unifies tokio features over its
        # own closure, producing a second tokio compilation whose
        # hash-mangled CONTEXT thread-local differs from the one
        # perry-stdlib's runtime enters. The final binary then carries two
        # CONTEXT TLS variables and any I/O wrapper panics at runtime with
        # "there is no reactor running". One invocation forces cargo to
        # resolve a single tokio artifact for the whole closure — identical
        # mangled symbols, linker dedup, one TLS (this is exactly what the
        # in-tree auto-optimize path does; the authoritative crate list is
        # `binding_needs_shared_tokio` in
        # crates/perry/src/commands/compile/optimized_libs/freshness.rs).
        # `--keep-going` preserves the old best-effort semantics: a wrapper
        # that cannot build on this host is skipped without aborting the
        # rest, while feature unification still applies to every crate that
        # does build.
        if: steps.filter.outputs.run == 'true'
        run: |
          cargo build --${{ github.event.inputs.profile }} --target ${{ steps.target.outputs.triple }} --keep-going \
            -p perry-runtime -p perry-runtime-static \
            -p perry-stdlib -p perry-stdlib-static \
            -p perry-ext-net -p perry-ext-ws -p perry-ext-http \
            -p perry-ext-axios -p perry-ext-fetch -p perry-ext-undici \
            -p perry-ext-fastify -p perry-ext-mongodb -p perry-ext-pg \
            -p perry-ext-mysql2 -p perry-ext-ioredis -p perry-ext-nodemailer

      - name: Build remaining native ext libraries (CPU-only)
        # CPU-only wrappers (bcrypt, sharp, zlib, dotenv, ...) route their
        # async work through perry-ffi's spawn_blocking shim into
        # perry-stdlib's tokio — they carry no tokio of their own, so
        # separate invocations are safe here. Every crate on the
        # shared-tokio list above must stay OUT of this loop or #507
        # regresses silently.
        if: steps.filter.outputs.run == 'true' && runner.os != 'Windows'
        run: |
          SHARED_TOKIO="perry-ext-net perry-ext-ws perry-ext-http perry-ext-axios perry-ext-fetch perry-ext-undici perry-ext-fastify perry-ext-mongodb perry-ext-pg perry-ext-mysql2 perry-ext-ioredis perry-ext-nodemailer"
          for d in crates/perry-ext-*; do
            [ -d "$d" ] || continue
            name=$(basename "$d")
            case " $SHARED_TOKIO " in
              *" $name "*) continue ;;
            esac
            cargo build --${{ github.event.inputs.profile }} --target ${{ steps.target.outputs.triple }} -p "$name" || true
          done

      - name: Verify shared tokio across stdlib and tokio-set ext libs
        # Gates the #507 property the bundle actually ships: the tokio
        # crate-hash (the `Cs<hash>_5tokio` prefix baked into every mangled
        # tokio symbol) must be identical in libperry_stdlib.a and every
        # tokio-using ext archive. A mismatch means the final binary gets
        # two CONTEXT TLS variables — the exact silent-runtime-panic defect
        # this workflow previously shipped. A mismatch fails the job; a
        # missing lib (keep-going skipped it) only warns, because a missing
        # archive fails loudly at compile time instead of at runtime.
        if: steps.filter.outputs.run == 'true' && runner.os != 'Windows'
        run: |
          set -euo pipefail
          LIBDIR="target/${{ steps.target.outputs.triple }}/${{ github.event.inputs.profile }}"
          # NOTE: every `grep | sort` pipeline carries `|| true` — under
          # `set -euo pipefail` a NO-MATCH grep exits 1, which would abort the
          # script silently before the verdict (a wrapper with no tokio symbols
          # at all — undici rides the shared build but has no tokio dep — is a
          # valid, safe state). Missing files are guarded by the explicit `-f`
          # checks; stdlib presence is asserted by the empty-string branch.
          STDLIB_TOKIO="$(grep -aoE 'Cs[0-9a-zA-Z]{8,}_5tokio' "$LIBDIR/libperry_stdlib.a" 2>/dev/null | sort -u || true)"
          if [ -z "$STDLIB_TOKIO" ] || [ "$(printf '%s\n' "$STDLIB_TOKIO" | wc -l)" -ne 1 ]; then
            echo "::error::libperry_stdlib.a must reference exactly one tokio instance (got: ${STDLIB_TOKIO:-<none>})"
            exit 1
          fi
          if grep -aqE 'Cs[0-9a-zA-Z]{8,}_5tokio' "$LIBDIR/libperry_runtime.a" 2>/dev/null; then
            RUNTIME_TOKIO="$(grep -aoE 'Cs[0-9a-zA-Z]{8,}_5tokio' "$LIBDIR/libperry_runtime.a" 2>/dev/null | sort -u || true)"
            if [ "$RUNTIME_TOKIO" != "$STDLIB_TOKIO" ]; then
              echo "::error::libperry_runtime.a tokio ($RUNTIME_TOKIO) != stdlib tokio ($STDLIB_TOKIO)"
              exit 1
            fi
          fi
          for lib in net ws http axios fetch undici fastify mongodb pg mysql2 ioredis nodemailer; do
            archive="$LIBDIR/libperry_ext_$lib.a"
            if [ ! -f "$archive" ]; then
              echo "::warning::libperry_ext_$lib.a missing (keep-going skipped it) — out-of-tree users fall back to the perry-stdlib copy or a compile-time error"
              continue
            fi
            lib_tokio="$(grep -aoE 'Cs[0-9a-zA-Z]{8,}_5tokio' "$archive" 2>/dev/null | sort -u || true)"
            # A wrapper with NO tokio symbols (undici) cannot carry the
            # CONTEXT collision; only compare when the archive actually
            # references tokio.
            if [ -n "$lib_tokio" ] && [ "$lib_tokio" != "$STDLIB_TOKIO" ]; then
              echo "::error::libperry_ext_$lib.a tokio ($lib_tokio) != stdlib tokio ($STDLIB_TOKIO) — CONTEXT TLS mismatch, runtime panic (#507)"
              exit 1
            fi
          done
          echo "shared-tokio verification passed: $STDLIB_TOKIO"

      - name: Package (Unix)
        if: steps.filter.outputs.run == 'true' && runner.os != 'Windows'
        run: |
          mkdir -p staging
          cp target/${{ steps.target.outputs.triple }}/${{ github.event.inputs.profile }}/perry staging/
          for lib in libperry_runtime.a libperry_stdlib.a; do
            cp "target/${{ steps.target.outputs.triple }}/${{ github.event.inputs.profile }}/$lib" staging/
          done
          for lib in target/${{ steps.target.outputs.triple }}/${{ github.event.inputs.profile }}/libperry_ext_*.a; do
            [ -f "$lib" ] && cp "$lib" staging/
          done
          for lib in libperry_ui_macos.a libperry_ui_gtk4.a; do
            [ -f "target/${{ steps.target.outputs.triple }}/${{ github.event.inputs.profile }}/$lib" ] && \
              cp "target/${{ steps.target.outputs.triple }}/${{ github.event.inputs.profile }}/$lib" staging/
          done
          cd staging
          tar czf ../${{ matrix.artifact }}.tar.gz *
          cd ..
          # Lite bundle - perry + stdlib + runtime only, no ext/UI libs
          mkdir -p staging-lite
          cp target/${{ steps.target.outputs.triple }}/${{ github.event.inputs.profile }}/perry staging-lite/
          for lib in libperry_runtime.a libperry_stdlib.a; do
            cp "target/${{ steps.target.outputs.triple }}/${{ github.event.inputs.profile }}/$lib" staging-lite/
          done
          cd staging-lite
          tar czf ../${{ matrix.artifact }}-lite.tar.gz *

      - name: Package (Windows)
        if: steps.filter.outputs.run == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging
          Copy-Item "target/${{ steps.target.outputs.triple }}/${{ github.event.inputs.profile }}/perry.exe" staging/
          $libs = @("perry_runtime.lib", "perry_stdlib.lib")
          foreach ($lib in $libs) {
            $path = "target/${{ steps.target.outputs.triple }}/${{ github.event.inputs.profile }}/$lib"
            if (Test-Path $path) { Copy-Item $path staging/ }
          }
          Get-ChildItem "target/${{ steps.target.outputs.triple }}/${{ github.event.inputs.profile }}/perry_ext_*.lib" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName staging/
          }
          Compress-Archive -Path staging/* -DestinationPath "${{ matrix.artifact }}.zip"
          # Lite bundle - perry + stdlib + runtime only, no ext/UI libs
          New-Item -ItemType Directory -Force -Path staging-lite
          Copy-Item "target/${{ steps.target.outputs.triple }}/${{ github.event.inputs.profile }}/perry.exe" staging-lite/
          foreach ($lib in $libs) {
            $path = "target/${{ steps.target.outputs.triple }}/${{ github.event.inputs.profile }}/$lib"
            if (Test-Path $path) { Copy-Item $path staging-lite/ }
          }
          Compress-Archive -Path staging-lite/* -DestinationPath "${{ matrix.artifact }}-lite.zip"

      - name: Upload artifact (Unix)
        if: steps.filter.outputs.run == 'true' && runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: "*.tar.gz"

      - name: Upload lite artifact (Unix)
        if: steps.filter.outputs.run == 'true' && runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-lite
          path: "*-lite.tar.gz"

      - name: Upload artifact (Windows)
        if: steps.filter.outputs.run == 'true' && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: "*.zip"

      - name: Upload lite artifact (Windows)
        if: steps.filter.outputs.run == 'true' && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-lite
          path: "*-lite.zip"
