# Supply-chain soak for cargo's own dependency resolution — the same
# soak-window rule the npm side applies via minimumReleaseAge /
# min-release-age: crate versions younger than the window are skipped by
# the resolver unless already in Cargo.lock. Cargo stabilized
# min-publish-age in Rust 1.100; this policy is now active without an
# `[unstable]` opt-in.
# Managed by scripts/soak/soak.mts (`npm run soak` / `npm run soak:fix`).
[registry]
global-min-publish-age = "7 days"

# Invoke-EH (#7302): the exception transport steps runtime Rust frames via
# the system unwinder, and panic=abort (profile.release) omits unwind tables
# by default — without this flag every throw crossing a helper frame is
# stranded. NOTE: a user-set RUSTFLAGS environment variable OVERRIDES this
# file entirely (cargo uses exactly one rustflags source) — carry the flag
# in your RUSTFLAGS too. The runtime self-checks on the first `try` and
# aborts loudly if the tables are missing (perry-runtime/src/eh.rs).
#
# `-Z use-sync-unwind=yes` asks for SYNCHRONOUS tables — exact at call sites
# only. That is every PC the transport ever unwinds from (throws, GC
# safepoints and `_Unwind_Backtrace` all start at a call; no signal handler
# throws). Asynchronous tables (the default for force-unwind-tables) also
# describe every epilogue instruction, which Apple's compact-unwind encoder
# cannot express, so ~90% of runtime functions fell back to a DWARF FDE:
# ~500 KB of `__eh_frame` in every macOS binary. Synchronous tables encode
# compactly and `eh_walker` decodes compact FRAME/FRAMELESS entries directly.
# Nightly-only, like the rest of this toolchain (rust-toolchain.toml).
[build]
rustflags = ["-C", "force-unwind-tables=yes", "-Z", "use-sync-unwind=yes"]

# Static-musl link fix (#7353 in-process LLVM): the final perry link pulls
# llvm-config's --system-libs search dirs, and on ARM64 hosts apt.llvm.org's
# llvm-config emits `-L/usr/lib/aarch64-linux-gnu` (the GLIBC multiarch dir).
# Build-script -L dirs land BEFORE rustc's musl self-contained dir, so `-lc`
# resolves to glibc's static libc.a and the link dies on
# `libc.a(iofclose.o): undefined reference to '__gcc_personality_v0'`.
# Prepending the musl libc dir (musl-tools installs it) makes `-lc` hit
# musl's libc.a first.
#
# NOTE: cargo does NOT merge `target.*.rustflags` with `[build].rustflags` —
# a matching target table replaces it entirely, so the FULL `[build]` list
# (force-unwind-tables AND use-sync-unwind) is REPEATED in each musl table;
# a runtime without unwind tables strands every throw.
#
# NOTE: this only fixes the LIBRARY-SELECTION failure. glibc-built LLVM
# objects also carry versioned refs (`__isoc23_strtoull@@GLIBC_2.38`) and the
# system libs (-lz3 -lxml2 -lffi ...) that a musl binary cannot satisfy at
# runtime — a musl+glibc mixed process segfaults at startup. Musl targets
# must therefore be built WITHOUT the llvm-inprocess feature (see the musl
# feature handling in .github/workflows/manual-build.yml), keeping the
# binary pure static musl. (The release pipeline's musl legs are exempt: they
# build inside Alpine with a musl-built LLVM, so llvm-inprocess stays ON.)
[target.aarch64-unknown-linux-musl]
rustflags = ["-L", "native=/usr/lib/aarch64-linux-musl", "-C", "force-unwind-tables=yes", "-Z", "use-sync-unwind=yes"]

# A specific-triple table also shadows any cfg-table flags, and — like every
# target table — replaces `[build]` entirely, so the full list is repeated.
# No `force-frame-pointers`: #9486 once needed it on x86_64 because
# `Error.stack` walked the `rbp` chain, but the capture now steps frames by
# their unwind tables (`perry-runtime/src/eh_walker_trace.rs`), so frame
# pointers are pure cost (~3% of runtime instructions; tsc +2.6%, Zod +3.4%).
[target.x86_64-unknown-linux-musl]
rustflags = [
  "-L", "native=/usr/lib/x86_64-linux-musl",
  "-C", "force-unwind-tables=yes",
  "-Z", "use-sync-unwind=yes",
]

# Ubuntu gcc 13 defaults to -D_FORTIFY_SOURCE=3, and on aarch64 its codegen
# turns memcpy into __memcpy_chk calls in zstd's C sources (x86_64 proves the
# object sizes and emits plain memcpy). musl's libc.a provides no *_chk
# symbols, so the musl link dies with
# `zstd_v01.c: undefined reference to '__memcpy_chk'` on arm64 hosts. Kill
# fortify for musl-target C compiles only (the cc crate reads these per-target
# env vars); glibc targets keep the distro default.
[env]
CFLAGS_aarch64_unknown_linux_musl = "-U_FORTIFY_SOURCE"
CXXFLAGS_aarch64_unknown_linux_musl = "-U_FORTIFY_SOURCE"
CFLAGS_x86_64_unknown_linux_musl = "-U_FORTIFY_SOURCE"
CXXFLAGS_x86_64_unknown_linux_musl = "-U_FORTIFY_SOURCE"

# The bundled SQLite is built as node's is in this one respect: node compiles
# it with SQLITE_DEFAULT_MEMSTATUS=0 (`PRAGMA compile_options` on node 26),
# so every sqlite3_malloc skips the global memory-statistics mutex and
# counters. Nothing in perry reads SQLite's memory statistics.
# (Single `[env]` table: TOML forbids a duplicate header, and the fork's musl
# CFLAGS table above collided with upstream's LIBSQLITE3_FLAGS table after a
# remote sync merged both regions without a textual conflict.)
LIBSQLITE3_FLAGS = "-DSQLITE_DEFAULT_MEMSTATUS=0"

# No `force-frame-pointers`. #9486 once set it for x86_64 because
# `Error.stack` walked the `rbp` chain, which runtime Rust frames on
# x86_64-unknown-linux-gnu do not maintain (rustc keeps `rbp` a general
# callee-saved register there). It cost ~3% of runtime instructions on real
# programs (tsc +2.6%, Zod +3.4%). The capture now steps x86_64 Linux frames by
# their unwind tables (`perry-runtime/src/eh_walker_trace.rs`); the collector's
# x86_64 walk and the exception transport always did. Apple targets and
# AArch64 Linux keep frame records by rustc's own default, so their chain walk
# is unchanged. Do not reintroduce a `[target.*] rustflags` table without
# repeating the `[build]` flags in it: cargo uses the target list INSTEAD of
# the build list, and a runtime without unwind tables strands every throw.
# (Fork exception: the musl target tables above exist solely to prepend the
# musl libc search dir — they repeat the full `[build]` flag list.)

# The compiler and every archive it links, in one Cargo graph (the workspace
# `default-members` minus perry-container-compose): `cargo build-perry
# --release [-p <more>]`. CI and recipes that add packages to the build use
# this so the runtime, stdlib and wrapper archives stay one graph (#7358).
# (Upstream's own `[env] LIBSQLITE3_FLAGS` table that used to sit above this
# alias lives in the single `[env]` table near the top of this file — TOML
# forbids duplicate headers; see the merge note there.)
[alias]
build-perry = [
    "build",
    "-p", "perry",
    "-p", "perry-runtime-static",
    "-p", "perry-stdlib-static",
    "-p", "perry-wasm-host",
    "-p", "perry-ext-ads",
    "-p", "perry-ext-argon2",
    "-p", "perry-ext-bcrypt",
    "-p", "perry-ext-better-sqlite3",
    "-p", "perry-ext-cheerio",
    "-p", "perry-ext-ethers",
    "-p", "perry-ext-http",
    "-p", "perry-ext-net",
    "-p", "perry-ext-nodemailer",
    "-p", "perry-ext-parcel-watcher",
    "-p", "perry-ext-pdf",
    "-p", "perry-ext-sharp",
    "-p", "perry-ext-typescript",
    "-p", "perry-ext-undici",
    "-p", "perry-ext-ws",
    "-p", "perry-ext-zlib",
]

# The instrumented prebuilt variant (`scripts/build_instr_runtime.sh`): the
# archives of `build-perry` (not the compiler, not the WebAssembly host) built
# with `PERRY_RUNTIME_INSTRUMENTS=1` into their own target dir, so each one
# bundles an instrumented runtime from one graph.
build-perry-instr = [
    "build",
    "-p", "perry-runtime-static",
    "-p", "perry-stdlib-static",
    "-p", "perry-ext-ads",
    "-p", "perry-ext-argon2",
    "-p", "perry-ext-bcrypt",
    "-p", "perry-ext-better-sqlite3",
    "-p", "perry-ext-cheerio",
    "-p", "perry-ext-ethers",
    "-p", "perry-ext-http",
    "-p", "perry-ext-net",
    "-p", "perry-ext-nodemailer",
    "-p", "perry-ext-parcel-watcher",
    "-p", "perry-ext-pdf",
    "-p", "perry-ext-sharp",
    "-p", "perry-ext-typescript",
    "-p", "perry-ext-undici",
    "-p", "perry-ext-ws",
    "-p", "perry-ext-zlib",
]
